org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official

# Pinned to Android Studio's own bundled JDK, project-local only (does not touch the
# system JAVA_HOME): installing JDK 25 system-wide left it shadowing `java` on PATH, and
# this project's Kotlin compiler version cannot parse a JDK 25 version string (throws
# IllegalArgumentException in JavaVersion.parse). JDK 21 is the standard, tested baseline
# for this AGP/Kotlin toolchain.
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
