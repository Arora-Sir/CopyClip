<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CopyClip banner</title>
<style>
  :root { --bg: #14161b; --ink: #f2f4f8; --mute: #9aa3b2; --acc: #4cc2ff; --ok: #6ccb5f; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; background:
    radial-gradient(900px 520px at 85% 15%, rgba(76,194,255,.18), transparent 60%),
    radial-gradient(700px 480px at 0% 100%, rgba(108,203,95,.10), transparent 60%), var(--bg);
    color: var(--ink); font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; position: relative; }
  .copy { position: absolute; left: 72px; top: 96px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 72px; height: 72px; }
  h1 { font-size: 64px; letter-spacing: -.03em; font-weight: 650; }
  .tag { margin-top: 26px; font-size: 27px; line-height: 38px; font-weight: 500; letter-spacing: -.01em; }
  .tag em { font-style: normal; color: var(--acc); }
  .sub { margin-top: 18px; font-size: 18px; line-height: 28px; color: var(--mute); }
  .chips { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 10px; }
  .chips span { padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); font-size: 15px; font-weight: 600; color: #d8dde7; }
  .chips span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: 1px; }
  .win { position: absolute; left: 610px; top: 84px; width: 640px; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.14); box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .win .bar { height: 30px; background: #202226; display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: #c9ced8; gap: 8px; }
  .win .bar img { width: 14px; height: 14px; }
  .win img.shot { display: block; width: 640px; }
  .flyout { position: absolute; left: 1085px; top: 300px; width: 170px; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.18); box-shadow: 0 24px 60px rgba(0,0,0,.6); }
  .flyout img { display: block; width: 170px; }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../windows_app/ui/icon.png" alt=""><h1>CopyClip</h1></div>
    <p class="tag">One clipboard across your <em>Windows PC</em>, <em>Galaxy phone</em> and <em>tablet</em>.</p>
    <p class="sub">Text, images and screenshots in about a second. No cloud, no account, nothing to install on the phone.</p>
    <div class="chips"><span>Over Tailscale</span><span>Plain ADB, no root</span><span>Zero dependencies</span></div>
  </div>
  <div class="win"><div class="bar"><img src="../../windows_app/ui/icon.png" alt="">CopyClip</div><img class="shot" src="../../docs/images/overview.png" alt=""></div>
  <div class="flyout"><img src="../../docs/images/flyout.png" alt=""></div>
</body></html>
